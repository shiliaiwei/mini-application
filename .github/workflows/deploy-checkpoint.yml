name: Deploy Checkpoint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  pre-deploy-checkpoint:
    name: Pre-Deploy Checkpoint Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkpoint 1 - Verify Unit & Regression Tests
        run: pnpm test

      - name: Checkpoint 2 - Verify Next.js Production Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Checkpoint 3 - Verify No Unwanted Artifacts or Heavy Media
        run: |
          echo "Scanning working tree for prohibited heavy files..."
          FOUND_HEAVY=$(git ls-files | grep -E '\.(mov|mp4|pptx|ppt|zip|pdf|docx|wav|mp3|ogg|aac|db)$' || true)
          if [ -n "$FOUND_HEAVY" ]; then
            echo "Error: Heavy media files detected in repository tracking:"
            echo "$FOUND_HEAVY"
            exit 1
          fi
          echo "Checkpoint 3 passed: No prohibited heavy files tracked."

  deploy-gate:
    name: Production Deploy Approval Gate
    needs: [pre-deploy-checkpoint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Checkpoint Passed
        run: |
          echo "All pre-deployment checkpoints passed successfully."
          echo "Repository is verified and release-ready for deployment."
