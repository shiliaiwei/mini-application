name: "Semgrep"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 2 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: "Semgrep SAST Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install --upgrade semgrep

      - name: Run Semgrep SAST scan
        run: |
          semgrep scan --config p/owasp-top-ten --config p/security-audit --config p/javascript --exclude '.agents' --exclude '.github' --sarif --output semgrep.sarif || true

      - name: Upload Semgrep scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep'
