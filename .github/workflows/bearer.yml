name: "Bearer"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '5 2 * * 1'

permissions:
  contents: read

jobs:
  bearer:
    name: "Bearer SAST & Privacy Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Bearer Scan
        uses: bearer/bearer-action@v2
        with:
          format: sarif
          output: bearer.sarif
          diff: false
        continue-on-error: true

      - name: Upload Bearer scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'bearer.sarif'
          category: 'bearer'
